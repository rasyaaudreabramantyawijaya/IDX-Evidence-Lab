name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff import-linter
      - run: ruff check .
      - name: Legacy UI build is up to date
        run: python scripts/build_legacy_ui.py --check
      - name: Module boundaries
        env:
          PYTHONPATH: src
        run: lint-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-portfolio.txt
      - run: python -m pip install -r requirements-portfolio.txt pytest-cov
      - name: Tests with coverage floor
        env:
          PYTHONPATH: src
        run: python -m pytest -q --cov --cov-fail-under=80

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if forbidden files are tracked
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)\.env|\.(pem|key|pdf|docx|png|jpe?g|webp|gif|heic|tiff|svg|zip)$|^data/usage-log' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden files are tracked:"
            echo "$bad"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Browser smoke test against the real backend. Report-only until it has run green on CI a few times.
  frontend-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-portfolio.txt
      - run: python -m pip install -r requirements-portfolio.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend
        run: |
          PYTHONPATH=src python -m idx_evidence_lab.web_app &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:5500/api/health && break; sleep 1; done
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          # Also runs the legacy-page fingerprint and CSP specs (frontend/e2e/legacy).
          LEGACY_BASE_URL: http://127.0.0.1:5500
          # On a mismatch, full DOM/text/style dumps and screenshots are uploaded below for diffing.
          LEGACY_DUMP: ${{ github.workspace }}/legacy-dump
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: legacy-ui-dump
          path: legacy-dump
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t idxel:ci .
      - name: Run and smoke-test
        run: |
          docker run -d --name idxel -p 5500:5500 -v "$PWD/data:/app/data:ro" idxel:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5500/api/health && break
            sleep 1
          done
          curl -s -D headers.txt -o body.json http://127.0.0.1:5500/api/health
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
          grep -qi '^content-security-policy:' headers.txt
          grep -q '"ok": true' body.json
          # The legacy UI is served as external files under the enforced CSP.
          curl -sf -o app.js http://127.0.0.1:5500/docs/prototypes/app.js
          curl -sf -o app.css http://127.0.0.1:5500/docs/prototypes/app.css
          curl -sf -o index.html http://127.0.0.1:5500/
          grep -q 'src="/docs/prototypes/app.js"' index.html
          ! grep -q '<style' index.html
          curl -s -D - -o /dev/null http://127.0.0.1:5500/ | grep -i "^content-security-policy:.*script-src 'self'"
      - name: Container logs on failure
        if: failure()
        run: docker logs idxel
      # Report-only for now: surfaces image CVEs without blocking merges.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: idxel:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

  # Single required status check for branch protection.
  ci:
    if: always()
    needs: [lint, test, hygiene, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          [ "${{ needs.lint.result }}" = "success" ] && \
          [ "${{ needs.test.result }}" = "success" ] && \
          [ "${{ needs.hygiene.result }}" = "success" ] && \
          [ "${{ needs.frontend.result }}" = "success" ] && \
          [ "${{ needs.docker.result }}" = "success" ]
