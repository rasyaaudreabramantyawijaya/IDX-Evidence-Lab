name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-portfolio.txt
      - run: python -m pip install -r requirements-portfolio.txt pytest-cov
      - name: Tests with coverage floor
        env:
          PYTHONPATH: src
        run: python -m pytest -q --cov --cov-fail-under=80

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if forbidden files are tracked
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)\.env|\.(pem|key|pdf|docx|png|jpe?g|webp|gif|heic|tiff|svg|zip)$|^data/usage-log' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden files are tracked:"
            echo "$bad"
            exit 1
          fi

  # Single required status check for branch protection.
  ci:
    if: always()
    needs: [lint, test, hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          [ "${{ needs.lint.result }}" = "success" ] && \
          [ "${{ needs.test.result }}" = "success" ] && \
          [ "${{ needs.hygiene.result }}" = "success" ]
