<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IDX Evidence Lab</title></head>
<body>
<div id="idxel-journey">
  <link rel="stylesheet" href="/docs/prototypes/app.css">
  <a class="skip-link" href="#idxel-main">Lewati ke konten utama</a>
  <div class="top"><nav class="history-controls" aria-label="Navigasi riwayat aplikasi"><button class="history-control" data-action="history-back" aria-label="Back" title="Back" disabled>&lt; Back</button><button class="history-control" data-action="history-forward" aria-label="Forward" title="Forward" disabled>Forward &gt;</button></nav><input class="search" aria-label="Cari ticker, broker, sektor, atau pertanyaan" placeholder="⌕  Cari ticker, broker, sektor, atau pertanyaan…">
  <section class="search-results hidden" id="idxel-search-results" role="region" aria-label="Hasil pencarian" aria-live="polite"></section></div>
  <div class="shell"><aside class="side" aria-label="Navigasi utama">
    <div class="nav-group">Workspace</div>
    <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⌂</span><span class="nav-text">Dashboard</span></button>
    <div class="nav-group">Research</div>
    <button class="nav-item" data-page="screener"><span class="nav-icon">⌕</span><span class="nav-text">Screener</span></button>
    <button class="nav-item" data-page="watchlist"><span class="nav-icon">☆</span><span class="nav-text">Watchlist</span></button>
    <button class="nav-item" data-page="studies"><span class="nav-icon">▤</span><span class="nav-text">Studies</span></button>
    <button class="nav-item" data-page="research"><span class="nav-icon">⌕</span><span class="nav-text">Riset emiten</span></button>
    <button class="nav-item" data-page="portfolio-lab"><span class="nav-icon">◇</span><span class="nav-text">Portfolio Lab</span></button>
    <div class="nav-group">Market</div>
    <button class="nav-item" data-page="market"><span class="nav-icon">◫</span><span class="nav-text">Market overview</span></button>
    <button class="nav-item" data-page="news-universe"><span class="nav-icon">◉</span><span class="nav-text">News Universe</span></button>
    <div class="nav-group">Evidence</div>
    <button class="nav-item" data-page="sources"><span class="nav-icon">⇩</span><span class="nav-text">Sumber & metode · PDF</span></button>
    <div class="side-bottom"><button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span class="nav-text">Settings</span></button><div class="build-note">Analisis lokal<br>Daily sesuai histori tersedia per ticker</div></div>
  </aside><div class="side-splitter" role="separator" aria-orientation="vertical" aria-label="Ubah lebar sidebar" tabindex="0"></div><main class="main" id="idxel-main" tabindex="-1" aria-live="polite"></main></div>
  <div class="overlay hidden" id="idxel-modal" role="dialog" aria-modal="true" aria-labelledby="idxel-modal-title"><div class="dialog"><h2 id="idxel-modal-title">Konfirmasi</h2><p id="idxel-modal-copy"></p><div class="dialog-actions"><button class="action" data-action="close-modal">Kembali</button><button class="action primary" data-action="confirm-modal">Lanjutkan</button></div></div></div>
  <div class="overlay hidden" id="watchlist-picker" role="dialog" aria-modal="true" aria-labelledby="watchlist-picker-title"><div class="dialog watchlist-dialog"><div class="watchlist-dialog-head"><h2 id="watchlist-picker-title">Cari emiten</h2><button class="watchlist-dialog-close" data-action="watchlist-close-picker" aria-label="Tutup">×</button></div><input class="watchlist-picker-search" id="watchlist-issuer-search" type="search" placeholder="Cari ticker atau nama emiten…" aria-label="Cari ticker atau nama emiten"><div class="watchlist-picker-list" id="watchlist-picker-list"></div><div class="watchlist-picker-foot"><span class="sub" id="watchlist-picker-count"></span><button class="action primary" data-action="watchlist-close-picker">Selesai</button></div></div></div>
  <div class="loggedout hidden" id="idxel-loggedout"><div><div class="mark">◈</div><h1>Anda sudah keluar</h1><p>Sesi IDX Evidence Lab telah berakhir. Masuk kembali untuk membuka dashboard dan melanjutkan riset.</p><button class="action primary" data-action="login-again">Masuk kembali</button></div></div>
  <div class="toast hidden" id="idxel-toast" role="status" aria-live="polite"></div>
  <script src="/docs/prototypes/studies-ui.js"></script>
  <script src="/docs/prototypes/app.js"></script>
</div>
</body>
</html>
