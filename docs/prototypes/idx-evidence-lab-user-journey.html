<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IDX Evidence Lab</title></head>
<body>
<div id="idxel-journey">
  <link rel="stylesheet" href="/docs/prototypes/app.css">
  <a class="skip-link" href="#idxel-main">Lewati ke konten utama</a>
  <div class="shell"><aside class="side" aria-label="Navigasi utama">
    <div class="brand"><span class="brand-mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg></span><span class="brand-name">IDX Evidence</span></div>
    <div class="nav-group">Workspace</div>
    <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⌂</span><span class="nav-text">Dashboard</span></button>
    <div class="nav-group">Research</div>
    <button class="nav-item" data-page="screener"><span class="nav-icon">⌕</span><span class="nav-text">Screener</span></button>
    <button class="nav-item" data-page="watchlist"><span class="nav-icon">☆</span><span class="nav-text">Watchlist</span></button>
    <button class="nav-item" data-page="studies"><span class="nav-icon">▤</span><span class="nav-text">Studies</span></button>
    <button class="nav-item" data-page="research"><span class="nav-icon">⌕</span><span class="nav-text">Issuer Research</span></button>
    <button class="nav-item" data-page="portfolio-lab"><span class="nav-icon">◇</span><span class="nav-text">Portfolio Lab</span></button>
    <div class="nav-group">Market</div>
    <button class="nav-item" data-page="market"><span class="nav-icon">◫</span><span class="nav-text">Market overview</span></button>
    <button class="nav-item" data-page="news-universe"><span class="nav-icon">◉</span><span class="nav-text">News Universe</span></button>
    <div class="nav-group">Evidence</div>
    <button class="nav-item" data-page="sources"><span class="nav-icon">⇩</span><span class="nav-text">Sources & Methodology · PDF</span></button>
    <div class="side-bottom"><div class="nav-group">System</div><button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span class="nav-text">Settings</span></button><div class="build-note">Analisis lokal<br>Daily sesuai histori tersedia per ticker</div></div>
  </aside><div class="side-splitter" role="separator" aria-orientation="vertical" aria-label="Ubah lebar sidebar" tabindex="0"></div><div class="workspace"><header class="top"><nav class="history-controls" aria-label="Navigasi riwayat aplikasi"><button class="history-control" data-action="history-back" aria-label="Back" title="Back" disabled><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"/></svg></button><button class="history-control" data-action="history-forward" aria-label="Forward" title="Forward" disabled><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18l6-6-6-6"/></svg></button></nav><div class="top-search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="search" aria-label="Search ticker, broker, or research" placeholder="Search ticker, broker, or research (e.g. BBCA, ZP, DCFX)…"><section class="search-results hidden" id="idxel-search-results" role="region" aria-label="Hasil pencarian" aria-live="polite"></section></div><div class="top-actions"><button class="top-btn" data-action="refresh-dashboard"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>Refresh</span></button><button class="top-btn top-btn-primary" data-action="go-sources"><span>Sources &amp; Methodology · PDF</span></button><button class="top-icon" aria-label="Notifications" title="No notifications"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button><button class="top-avatar" data-page="settings" aria-label="Profile &amp; Settings" title="Profile &amp; Settings">QT</button></div></header><main class="main" id="idxel-main" tabindex="-1" aria-live="polite"></main></div></div>
  <div class="overlay hidden" id="idxel-modal" role="dialog" aria-modal="true" aria-labelledby="idxel-modal-title"><div class="dialog"><h2 id="idxel-modal-title">Confirm</h2><p id="idxel-modal-copy"></p><div class="dialog-actions"><button class="action" data-action="close-modal">Back</button><button class="action primary" data-action="confirm-modal">Continue</button></div></div></div>
  <div class="overlay hidden" id="watchlist-picker" role="dialog" aria-modal="true" aria-labelledby="watchlist-picker-title"><div class="dialog watchlist-dialog"><div class="watchlist-dialog-head"><h2 id="watchlist-picker-title">Search Issuer</h2><button class="watchlist-dialog-close" data-action="watchlist-close-picker" aria-label="Close">×</button></div><input class="watchlist-picker-search" id="watchlist-issuer-search" type="search" placeholder="Search ticker or issuer name…" aria-label="Cari ticker atau nama emiten"><div class="watchlist-picker-list" id="watchlist-picker-list"></div><div class="watchlist-picker-foot"><span class="sub" id="watchlist-picker-count"></span><button class="action primary" data-action="watchlist-close-picker">Done</button></div></div></div>
  <div class="loggedout hidden" id="idxel-loggedout"><div><div class="mark">◈</div><h1>Anda sudah keluar</h1><p>Sesi IDX Evidence Lab telah berakhir. Masuk kembali untuk membuka dashboard dan melanjutkan riset.</p><button class="action primary" data-action="login-again">Sign In Again</button></div></div>
  <div class="toast hidden" id="idxel-toast" role="status" aria-live="polite"></div>
  <script src="/docs/prototypes/studies-ui.js"></script>
  <script src="/docs/prototypes/app.js"></script>
</div>
</body>
</html>
